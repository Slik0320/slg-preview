<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="slg-mode" content="demo">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trade Desk — Sam's Liquor Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/staff.css">
</head>
<body class="staff">

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="staff.html">
      <span class="brand-mark">SLG</span>
      <span class="brand-txt">Trade desk</span>
    </a>
    <div class="who" id="who" hidden>
      <span class="who-name" id="who-name"></span>
      <span class="who-role" id="who-role"></span>
    </div>
    <div class="hdr-actions">
      <a class="icon-btn link-btn" href="shop.html" title="Open the customer catalogue">Catalogue</a>
      <button class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
      <button class="icon-btn" id="signout" hidden>Sign out</button>
    </div>
  </div>
</header>

<!-- signed out -->
<main id="signin-view" hidden>
  <section class="signin">
    <p class="kicker">Staff access</p>
    <h1>Sign in to the trade desk.</h1>
    <p class="lede">Store staff see their own store's queue. A group admin sees all four stores, the price list and trade accounts.</p>
    <form class="signin-form" id="signin-form">
      <label class="field">
        <span class="field-lab">Email</span>
        <input class="input" id="si-email" type="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field-lab">Password</span>
        <input class="input" id="si-password" type="password" autocomplete="current-password" required>
      </label>
      <div class="form-error" id="si-error" hidden></div>
      <button class="btn-primary" id="si-submit" type="submit">Sign in</button>
    </form>
  </section>
</main>

<!-- signed in -->
<main id="desk-view" hidden>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <button class="icon-btn" id="refresh" title="Reload the queue">Refresh</button>
  </div>

  <div id="queue" class="queue" aria-busy="true"></div>
</main>

<script type="module" src="app/staff/main.js"></script>
</body>
</html>
